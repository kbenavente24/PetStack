<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - PetStack</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&display=swap" rel="stylesheet">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body">
    <header class="dashboard-header">
        <a href="dashboard.html" class="dashboard-logo-link"><img src="images/logo.png" alt="PetStack Logo" class="dashboard-logo-icon"><h1 class="dashboard-logo">PetStack</h1></a>
        <nav class="header-nav">
            <a href="dashboard.html" class="header-nav-btn" title="Dashboard"><img src="images/dashboard-header-icon.png" alt="Dashboard" class="nav-icon"></a>
            <a href="households.html" class="header-nav-btn" title="Households"><img src="images/households-header-icon.png" alt="Households" class="nav-icon"></a>
            <a href="profile.html" class="header-nav-btn active" title="Profile"><img src="images/user-header-icon.png" alt="Profile" class="nav-icon"></a>
        </nav>
    </header>

    <main class="dashboard-main">
        <h2 class="welcome-message" id="welcome-message">Your Profile</h2>

        <section class="profile-content">
            <div class="profile-avatar" id="profile-avatar">
                <span class="profile-avatar-placeholder">👤</span>
            </div>

            <p class="profile-display-name" id="profile-display-name">Loading...</p>

            <div class="profile-actions">
                <button class="btn btn-secondary btn-full" id="btn-change-display-name">Change Display Name</button>
                <button class="btn btn-primary btn-full" id="btn-sign-out">Sign Out</button>
            </div>
        </section>
    </main>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal-card" class="modal-card">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-content" id="modal-content">
            </div>
        </div>
    </div>

    <script type="module" src="js/profile.js"></script>
</body>
</html>

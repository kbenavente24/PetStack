<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PetStack</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&display=swap" rel="stylesheet">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class = "dashboard-body">
    <header class="dashboard-header">
        <a href="dashboard.html" class="dashboard-logo-link"><h1 class="dashboard-logo">PetStack</h1></a>
        <nav class="header-nav">
            <a href="dashboard.html" class="header-nav-btn active" title="Dashboard">📋</a>
            <a href="households.html" class="header-nav-btn" title="Households">🏠</a>
            <a href="profile.html" class="header-nav-btn" title="Profile">👤</a>
        </nav>
    </header>

    <main class="dashboard-main">
        <h2 class="welcome-message" id="welcome-message" >Welcome, <span id="user-display-name">Friend</span>!</h2>

        <section id="empty-state" class="empty-state">
            <p class="empty-state-message" id="empty-state-message">Looks like you're not part of a household yet. Select an option below to get started!</p>

            <div class="action-cards">
                <button class="action-card hidden" id="btn-add-pet">
                    <span class="action-icon">🐾</span>
                    <span class="action-title">Add Your Pet</span>
                    <span class="action-desc">Start tracking activities for your furry friend</span>
                </button>

                <button class="action-card" id="btn-create-household">
                    <span class="action-icon">🏠</span>
                    <span class="action-title">Create a Household</span>
                    <span class="action-desc">Set up a space to share pet care with others</span>
                </button>

                <button class="action-card" id="btn-join-household">
                    <span class="action-icon">🤝</span>
                    <span class="action-title">Join a Household</span>
                    <span class="action-desc">Enter an invite code to join an existing group</span>
                </button>
            </div>
        </section>

        <!-- Active state: shown when user has pets/households (hidden by default) -->
        <section id="active-state" class="active-state hidden">

            <div class="pet-avatar" id="pet-avatar">
                <span class="pet-avatar-placeholder" id="pet-avatar-name">🐾</span>
            </div>

            <div class="dropdown-row">
                <span class="dropdown-icon">🏠</span>
                <select class="household-dropdown" id="household-dropdown"></select>
            </div>
            <div class="dropdown-row">
                <span class="dropdown-icon">🐾</span>
                <select class="pet-dropdown" id="pet-dropdown"></select>
            </div>

            <div class="date-nav" id="date-nav">
                <button id="date-prev">←</button>
                <span id="activity-date"></span>
                <button class ="date-next" id="date-next">→</button>
            </div>

            <div class="activity-buttons">
                <button class="activity-btn" data-type="FED" title="Fed">
                    <img src="images/food-bowl.png" alt="Fed" class="activity-icon">
                </button>
                <button class="activity-btn" data-type="WALKED" title="Walked">
                    <img src="images/walking-icon.png" alt="Walked" class="activity-icon">
                </button>
                <button class="activity-btn" data-type="PEE" title="Pee">
                    <img src="images/pee.png" alt="Pee" class="activity-icon">
                </button>
                <button class="activity-btn" data-type="POOP" title="Poop">
                    <img src="images/poop.png" alt="Poop" class="activity-icon">
                </button>
            </div>

            <ul class="activity-log" id="activity-log">

            </ul>
        </section>
    </main>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div id ="modal-card" class="modal-card">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-content" id="modal-content">

            </div>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>

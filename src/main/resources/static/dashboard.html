<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PetStack</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&display=swap" rel="stylesheet">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class = "dashboard-body">
    <header class="dashboard-header">
        <a href="dashboard.html" class="dashboard-logo-link"><img src="images/logo.png" alt="PetStack Logo" class="dashboard-logo-icon"><h1 class="dashboard-logo">PetStack</h1></a>
        <nav class="header-nav">
            <a href="dashboard.html" class="header-nav-btn active" title="Dashboard"><img src="images/dashboard-header-icon.png" alt="Dashboard" class="nav-icon"></a>
            <a href="households.html" class="header-nav-btn" title="Households"><img src="images/households-header-icon.png" alt="Households" class="nav-icon"></a>
            <a href="profile.html" class="header-nav-btn" title="Profile"><img src="images/user-header-icon.png" alt="Profile" class="nav-icon"></a>
        </nav>
    </header>

    <main class="dashboard-main">
        <h2 class="welcome-message" id="welcome-message" >Welcome, <span id="user-display-name">Friend</span>!</h2>

        <section id="empty-state" class="empty-state">
            <p class="empty-state-message" id="empty-state-message">Looks like you're not part of a household yet. Select an option below to get started!</p>

            <div class="action-cards">
                <button class="action-card hidden" id="btn-add-pet">
                    <span class="action-icon"><img src="images/pets-dashboard-icon.png" alt="Add Pet" class="action-icon-img"></span>
                    <span class="action-title">Add Your Pet</span>
                    <span class="action-desc">You're almost finished! After adding your first pet you can begin logging activities.</span>
                </button>

                <button class="action-card" id="btn-create-household">
                    <span class="action-icon"><img src="images/add-household-icon.png" alt="Create Household" class="action-icon-img" style="margin-left: 3px;"></span>
                    <span class="action-title">Create a Household</span>
                    <span class="action-desc">Set up a space to share pet care with others</span>
                </button>

                <button class="action-card" id="btn-join-household">
                    <span class="action-icon"><img src="images/join-household-icon.png" alt="Join Household" class="action-icon-img" style="margin-right: 7px;"></span>
                    <span class="action-title">Join a Household</span>
                    <span class="action-desc">Enter an invite code to join an existing group</span>
                </button>
            </div>
        </section>

        <!-- Active state: shown when user has pets/households (hidden by default) -->
        <section id="active-state" class="active-state hidden">

            <div class="pet-avatar" id="pet-avatar">
                <span class="pet-avatar-placeholder" id="pet-avatar-name">🐾</span>
            </div>

            <div class="dropdown-row">
                <span class="dropdown-icon"><img src="images/household-dashboard-icon.png" alt="Household" class="dropdown-icon-img"></span>
                <select class="household-dropdown" id="household-dropdown"></select>
            </div>
            <div class="dropdown-row">
                <span class="dropdown-icon"><img src="images/pets-dashboard-icon.png" alt="Pet" class="dropdown-icon-img"></span>
                <select class="pet-dropdown" id="pet-dropdown"></select>
            </div>

            <div class="date-nav" id="date-nav">
                <span id="activity-date" class="hidden"></span>
                <span id="today-label" class="today-label">Today</span>
                <div class="date-controls">
                    <button id="date-prev">←</button>
                    <input type="date" id="date-picker" class="date-picker">
                    <button class="date-next" id="date-next">→</button>
                </div>
            </div>

            <div class="activity-buttons">
                <button class="activity-btn" data-type="FED" title="Fed">
                    <img src="images/food-icon.png" alt="Fed" class="activity-icon">
                </button>
                <button class="activity-btn" data-type="WALKED" title="Walked">
                    <img src="images/walk-icon.png" alt="Walked" class="activity-icon">
                </button>
                <button class="activity-btn" data-type="PEE" title="Pee">
                    <img src="images/pee-icon.png" alt="Pee" class="activity-icon">
                </button>
                <button class="activity-btn" data-type="POOP" title="Poop">
                    <img src="images/poop-icon.png" alt="Poop" class="activity-icon">
                </button>
            </div>

            <ul class="activity-log" id="activity-log">

            </ul>
        </section>
    </main>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div id ="modal-card" class="modal-card">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-content" id="modal-content">

            </div>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>

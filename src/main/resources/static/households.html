<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Households - PetStack</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&display=swap" rel="stylesheet">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="households-body">
    <header class="dashboard-header">
        <a href="dashboard.html" class="dashboard-logo-link"><h1 class="dashboard-logo">PetStack</h1></a>
        <nav class="header-nav">
            <a href="dashboard.html" class="header-nav-btn" title="Dashboard">📋</a>
            <a href="households.html" class="header-nav-btn active" title="Households">🏠</a>
            <a href="profile.html" class="header-nav-btn" title="Profile">👤</a>
        </nav>
    </header>

    <main class="dashboard-main">
        <h2 class="welcome-message" id="welcome-message">Your Households</h2>
        <div class="household-page-btns" id="household-page-btns">
            <button class="btn btn-primary" id="create-household-btn">Create Household</button>
            <button class="btn btn-secondary" id="join-household-btn">Join Household</button>
        </div>


        <section id="households-content">
            <!-- Household circles will go here -->
        </section>
        <section class = "individual-household-content hidden" id="individual-household-content">
            <!-- Individual household content goes here -->
        </section>
    </main>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div id ="modal-card" class="modal-card">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-content" id="modal-content">

            </div>
        </div>
    </div>


    <script type="module" src="js/households.js"></script>
</body>
</html>

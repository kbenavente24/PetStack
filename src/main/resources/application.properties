spring.application.name=petstack

# Server Configuration
server.port=${PORT:8080}

# Database Configuration
# Uses environment variables in production, falls back to local defaults for development
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/PetStack}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:42812}

# JPA/Hibernate Configuration
# 'update' will create/modify tables automatically - useful for initial deployment
# Change to 'validate' once your schema is stable in production
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.petstack=DEBUG

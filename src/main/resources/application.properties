# -------------------------------
# Application Name
# -------------------------------
spring.application.name=petstack

# -------------------------------
# Server Configuration
# -------------------------------
# Railway injects PORT automatically
server.port=${PORT:8080}

# -------------------------------
# Database Configuration
# -------------------------------
# Uses Railway/Supabase env vars in production
# Falls back to local defaults for development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/PetStack}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:42812}

# -------------------------------
# JPA / Hibernate Configuration
# -------------------------------
# 'update' automatically creates missing tables for your empty Supabase DB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------
# Logging
# -------------------------------
logging.level.org.springframework.web=INFO
logging.level.com.petstack=DEBUG
